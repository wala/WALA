name: Continuous integration
on:
  merge_group:
  pull_request:
  push:
    branches-ignore:
      - 'dependabot/**'
      - 'gh-readonly-queue/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build_gradle:
    name: "JDK ${{ matrix.java }} on ${{ matrix.os }}"
    strategy:
      matrix:
        include:
          - os: macos-latest
            java: 17
          - os: windows-latest
            java: 17
          - os: ubuntu-latest
            java: 17
          - os: ubuntu-latest
            java: 21
          - os: ubuntu-latest
            java: 25
          - os: ubuntu-latest
            java: 27
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out WALA sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: 'Set up JDKs'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          # Install all the JDK versions we use in the matrix.  We do JDK 27 last to use that
          # to run Gradle.
          java-version: |
            17
            21
            25
            27
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: https://gradle.com/terms-of-service
          build-scan-terms-of-use-agree: 'yes'
      - name: Choose extra Linux-only Gradle tasks
        run: echo OS_SPECIFIC_GRADLE_TASKS='publishAllPublicationsToFakeRemoteRepository shellcheck' >> $GITHUB_ENV
        if: runner.os == 'Linux'
      - name: Prepare to run under XVFB
        run: echo XVFB_RUN=xvfb-run >> $GITHUB_ENV
        if: runner.os == 'Linux'
      - name: Build and test using Gradle
        shell: sh
        run: >-
          ${XVFB_RUN}
          ./gradlew
          --scan
          --console=colored "-Pcom.ibm.wala.jdk-version=${{ matrix.java }}"
          aggregatedJavadocs javadoc build ${OS_SPECIFIC_GRADLE_TASKS} checkGitCleanliness
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Test results for JDK ${{ matrix.java }} on ${{ matrix.os }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
      - name: Aggregate coverage
        id: jacoco_report
        run: ./gradlew testCodeCoverageReport "-Pcom.ibm.wala.jdk-version=${{ matrix.java }}"
        if: github.repository == 'wala/WALA'
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./code-coverage-report/build/reports/jacoco/testCodeCoverageReport/testCodeCoverageReport.xml
          token: ${{ secrets.WALA_MAIN_CODECOV_TOKEN }}
        if: steps.jacoco_report.outcome == 'success'
  upload_event_file:
    name: Upload event file
    runs-on: ubuntu-latest
    steps:
      - name: Upload event file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Event file
          path: ${{ github.event_path }}
  generate_docs:
    name: 'Generate latest docs'
    needs: build_gradle
    if: github.event_name == 'push' && github.repository == 'wala/WALA' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      JDK_VERSION: 27
    steps:
      - name: 'Check out repository'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: 'Set up JDK'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ env.JDK_VERSION }}
          distribution: 'zulu'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: 'Generate latest docs'
        env:
          GITHUB_TOKEN: ${{ secrets.WALA_BOT_GH_TOKEN }}
        run: ./generate-latest-docs.sh ${{ env.JDK_VERSION }}
